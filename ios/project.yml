# XcodeGen spec. The .xcodeproj is generated from this and is gitignored -
# hand-merging project.pbxproj conflicts is nobody's idea of a good time.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open InstAnalytics.xcodeproj
#
# CI runs the same generate step before building.

name: InstAnalytics

options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  InstAnalytics:
    type: application
    platform: iOS
    sources:
      - path: InstAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.instanalytics
        PRODUCT_NAME: InstAnalytics
        INFOPLIST_FILE: InstAnalytics/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        # Signing is supplied by CI or by you in Xcode. Left automatic so a
        # free Apple ID works for local runs with no further setup.
        CODE_SIGN_STYLE: Automatic
