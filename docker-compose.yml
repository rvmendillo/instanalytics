services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: instanalytics
      POSTGRES_USER: instanalytics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instanalytics}
    ports:
      - "5432:5432"
    volumes:
      # The story archive cannot be rebuilt from the API once stories expire.
      # This volume IS the data. Back it up.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instanalytics"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
